server:
  port: 8080

spring:
  application:
    name: amazon-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amazon_clone_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
#  mail:
