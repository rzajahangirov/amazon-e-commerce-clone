#  data:
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: ${REDIS_PORT:6379}

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:amazon-clone-dev-secret-change-in-production-minimum-32-characters}
    expiration-ms: 86400000
  upload:
    dir: uploads
  seeder:
    enabled: ${SEED_DATABASE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:my-bucket}
    region: ${AWS_REGION:eu-central-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
